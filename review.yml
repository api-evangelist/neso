specHarvest:
  harvested: false
  specsCount: 0
  detail: >
    No machine-readable API contract is published by NESO. The
    carbon-intensity/api-definitions repository (default branch master, 23 tree
    entries, checked via the GitHub API) contains only .github/, CNAME, README.md
    and a docs/ Jekyll-Slate site — no swagger, no openapi, no yaml/json spec of
    any kind. The Data Portal exposes the CKAN Action API, which is documented in
    prose on neso.energy rather than as OpenAPI. The GitHub org `neso-energy`
    exists but has 0 public repositories. No spec was authored, because authoring
    one here would be fabrication rather than harvest.
  openapiDirectoryOmitted: true
