apis:
- aid: neso:neso-data-portal-api
  name: NESO Data Portal API
  description: The public CKAN 2.8.7 API behind the NESO Data Portal, serving 128 open datasets
    covering GB electricity demand, generation, balancing, ancillary services, constraints,
    interconnectors, connection registers, network charges, the Demand Flexibility Service,
    and Future Energy Scenarios. Anonymous and unauthenticated - package_list, package_search,
    package_show, resource_search, resource_show, datastore_search and datastore_search_sql
    (PostgreSQL) all answer 200 with no key. All 128 datasets carry the NESO Open Data Licence.
    NESO asks for a maximum of one request per second against the CKAN API and two requests
    per minute against the datastore.
  humanURL: https://www.neso.energy/data-portal/api-guidance
