name: National Energy System Operator (NESO)
kind: company
description: The National Energy System Operator (NESO) is Great Britain's publicly owned,
  operationally independent electricity system operator and whole-energy system planner, created
  on 1 October 2024 when the UK government purchased National Grid Electricity System Operator
  Limited and folded in gas system planning from National Gas Transmission. NESO balances
  the GB electricity system in real time, runs the connections queue, publishes Future Energy
  Scenarios, and sits at the centre of the value chain between generators, interconnectors,
  transmission and distribution networks, and suppliers. Its API posture is the sector's classic
  split, and NESO lands firmly on the open side of that split. Market and system data is genuinely
  open and anonymous - the NESO Data Portal exposes 128 datasets over a public CKAN API at
  api.neso.energy with no key, no account and no application, all under the permissive NESO
  Open Data Licence, and the Carbon Intensity API for Great Britain that NESO develops is
  one of the most openly consumed public energy APIs in the world. There is no consumer data
  surface at all, and none is expected, because NESO holds no retail customer relationships,
  Britain has no consumer energy data-portability mandate comparable to the Australian Consumer
  Data Right, and smart-meter consumption data travels through the licensed Smart DCC monopoly
  rather than through the system operator. NESO's open-data obligation comes from Ofgem's
  Data Best Practice Guidance embedded in its RIIO-2 licence, and unlike most of the sector
  that obligation is visibly implemented rather than merely claimed.
