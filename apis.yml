- aid: neso:neso-carbon-intensity-api
  name: Carbon Intensity API
  description: The official Carbon Intensity API for Great Britain, developed by NESO, giving
    national and regional carbon intensity of GB electricity - actual, forecast up to 96+
    hours ahead, half-hourly generation mix, per-fuel emission factors, and regional breakdowns
    by DNO region, region id, or postcode. Fully anonymous REST/JSON over HTTPS with no API
    key and no registration; documented as a Slate reference site rather than as a downloadable
    OpenAPI contract.
  humanURL: https://carbon-intensity.github.io/api-definitions/
